[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splas-cn"
version = "0.2.0"
description = "Size-structured plankton with conservative dynamic carbon and nitrogen inventories"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.7"]

[project.optional-dependencies]
fast = ["numba>=0.60"]
research = ["pandas>=2", "openpyxl>=3.1", "reportlab>=4", "pypdf>=4"]

[tool.setuptools]
packages = ["splas2"]
