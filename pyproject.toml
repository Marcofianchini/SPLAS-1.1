[build-system]
requires = ["setuptools>=68", "wheel", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "splas"
version = "1.1.0"
description = "Reproducible 1-D size-structured NPZD model used in the Fianchini thesis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Research software; see upstream attribution in README.md"}
authors = [
  {name = "SPLAS contributors"}
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "meson>=1.2",
  "ninja>=1.11"
]

[project.scripts]
splas = "splas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splas = ["*.so", "*.pyd", "*.dylib"]
