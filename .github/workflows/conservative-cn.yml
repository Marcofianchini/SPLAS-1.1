name: Conservative C-N invariants
on:
  push:
    paths: ['splas2/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'research/requirements-reference.txt', '.github/workflows/conservative-cn.yml']
  pull_request:
    paths: ['splas2/**', 'tests/**', 'scripts/**', 'pyproject.toml', 'research/requirements-reference.txt', '.github/workflows/conservative-cn.yml']
jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c research/requirements-reference.txt '.[fast,research]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare_cultures.py
      - run: python -m splas2 --days 2 --output results/ci-smoke.npz
